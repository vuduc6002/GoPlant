  /media:
    post:
      tags:
        - Media
      summary: Tải lên tệp hình ảnh vào Private Storage qua Backend Proxy (G5.5.2b)
      description: >
        Nhận multipart/form-data với trường file (tối đa 5MB, JPEG, PNG, WebP).
        Backend kiểm tra magic bytes, giải mã kích thước (giới hạn 10000px / 25MP),
        loại bỏ metadata EXIF (GPS, thiết bị, camera), tự động xoay chuẩn theo orientation tag,
        tính toán SHA-256 hash và tải lên Supabase Private Bucket.
        Trả về 201 Created cùng metadata tệp (trạng thái READY). Không để lộ ownerId hay service role key.
      operationId: uploadMedia
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: Tệp hình ảnh hợp lệ (tối đa 5MB, JPEG/PNG/WebP)
      responses:
        '201':
          description: Tải lên và xử lý tệp thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaResponseWrapper'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '413':
          description: Kích thước tệp vượt quá 5MB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  code: FILE_TOO_LARGE
                  message: Kích thước tệp vượt quá giới hạn tối đa 5MB.
                  field: file
                timestamp: '2026-11-13T00:00:00Z'
        '503':
          description: Dịch vụ lưu trữ tạm thời không khả dụng
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  code: STORAGE_UNAVAILABLE
                  message: Không thể lưu trữ tệp tin vào kho lưu trữ
                timestamp: '2026-11-13T00:00:00Z'

  /media/{mediaId}/read-url:
    get:
      tags:
        - Media
      summary: Lấy signed URL đọc tạm thời cho tệp tin riêng tư (G5.5.2b)
      description: >
        Chỉ chủ sở hữu tệp tin mới có quyền lấy read URL (403 Forbidden nếu khác owner).
        URL được ký điện tử bởi Supabase Storage qua Backend Gateway với thời gian sống (TTL)
        cấu hình (mặc định 300 giây = 5 phút). Tệp tin phải ở trạng thái READY hoặc ATTACHED.
      operationId: getMediaReadUrl
      security:
        - BearerAuth: []
      parameters:
        - name: mediaId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Cấp signed read URL thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaReadUrlWrapper'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'

  /media/{mediaId}:
    delete:
      tags:
        - Media
      summary: Xóa tệp tin đa phương tiện khỏi hệ thống (G5.5.2b)
      description: >
        Chỉ chủ sở hữu tệp tin mới có quyền xóa (403 Forbidden nếu khác owner).
        Nếu tệp tin đang ở trạng thái ATTACHED (đang gắn kết với hồ sơ người dùng, vườn, cây trồng, lịch, nhật ký),
        hệ thống chặn xóa và trả về 409 Conflict (MEDIA_ATTACHED).
        Thao tác là idempotent (trả về 200 OK nếu tệp đã ở trạng thái DELETED).
      operationId: deleteMedia
      security:
        - BearerAuth: []
      parameters:
        - name: mediaId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Xóa tệp tin thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleMessageWrapper'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '409':
          description: Tệp tin đang được liên kết sử dụng, không thể xóa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  code: MEDIA_ATTACHED
                  message: Không thể xóa tệp phương tiện đang được liên kết sử dụng.
                  field: mediaId
                timestamp: '2026-11-13T00:00:00Z'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Gửi kèm JWT token dưới dạng `Bearer <token>` trong header `Authorization`

  responses:
    400BadRequest:
      description: Dữ liệu gửi lên không hợp lệ hoặc thiếu trường bắt buộc
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: VALIDATION_ERROR
              message: Dữ liệu đầu vào không hợp lệ
              field: email
            timestamp: '2026-10-31T09:00:00Z'

    401Unauthorized:
      description: Chưa đăng nhập hoặc token đã hết hạn
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: UNAUTHORIZED
              message: Phiên đăng nhập đã hết hạn hoặc token không hợp lệ
            timestamp: '2026-10-31T09:00:00Z'

    403Forbidden:
      description: Người dùng không có quyền truy cập tài nguyên này
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: FORBIDDEN
              message: Bạn không có quyền thao tác trên tài nguyên này
            timestamp: '2026-10-31T09:00:00Z'

    404NotFound:
      description: Không tìm thấy tài nguyên theo ID yêu cầu
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: RESOURCE_NOT_FOUND
              message: Không tìm thấy tài nguyên với định danh đã cung cấp
            timestamp: '2026-10-31T09:00:00Z'

    409Conflict:
      description: Xung đột tài nguyên (VD email đã tồn tại, tên trùng lặp)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: CONFLICT
              message: Email hoặc số điện thoại đã tồn tại trong hệ thống
            timestamp: '2026-10-31T09:00:00Z'


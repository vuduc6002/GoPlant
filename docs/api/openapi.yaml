openapi: 3.0.3
info:
  title: GoPlant REST API Contract
  version: 1.0.0
  description: >
    Tài liệu đặc tả RESTful API cho hệ thống Quản lý và Chăm sóc cây trồng GoPlant.
    Phục vụ giao tiếp chuẩn hóa giữa Frontend React Native + Expo và Backend Spring Boot.
servers:
  - url: https://api.goplant.vn/api/v1
    description: Production Server (Dự kiến)
  - url: http://localhost:8080/api/v1
    description: Local Development Server

tags:
  - name: Authentication
    description: Đăng ký, đăng nhập và cấp phát JWT token
  - name: Users
    description: Quản lý hồ sơ và đổi mật khẩu người dùng hiện tại
  - name: Species
    description: Danh mục giống cây trồng chuẩn và danh sách yêu thích
  - name: Gardens
    description: Quản lý không gian vườn cá nhân
  - name: Plants
    description: Quản lý hồ sơ cây trồng cá nhân trong vườn
  - name: Schedules
    description: Lập lịch và cập nhật chu kỳ chăm sóc
  - name: Care Logs
    description: Nhật ký thực hiện công việc chăm sóc cây
  - name: Growth Journals
    description: Nhật ký theo dõi quá trình sinh trưởng và hình ảnh
  - name: Admin Species
    description: Quản trị danh mục giống cây (ROLE_ADMIN)
  - name: Admin Users
    description: Quản trị tài khoản người dùng (ROLE_ADMIN)
  - name: Cameras
    description: Thông tin thiết bị giám sát camera (Backlog)

paths:
  /auth/register:
    post:
      tags:
        - Authentication
      summary: Đăng ký tài khoản người dùng mới
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Đăng ký thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponseWrapper'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '409':
          $ref: '#/components/responses/409Conflict'

  /auth/login:
    post:
      tags:
        - Authentication
      summary: Đăng nhập hệ thống bằng email/SĐT và mật khẩu
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Đăng nhập thành công, trả về JWT Access Token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponseWrapper'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'

  /users/me:
    get:
      tags:
        - Users
      summary: Lấy thông tin hồ sơ của người dùng hiện tại
      operationId: getCurrentUserProfile
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Lấy thông tin hồ sơ thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileWrapper'
        '401':
          $ref: '#/components/responses/401Unauthorized'
    put:
      tags:
        - Users
      summary: Cập nhật thông tin cá nhân
      operationId: updateCurrentUserProfile
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Cập nhật hồ sơ thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileWrapper'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'

  /users/me/password:
    put:
      tags:
        - Users
      summary: Đổi mật khẩu tài khoản
      operationId: changePassword
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Đổi mật khẩu thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleMessageWrapper'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'

  /species:
    get:
      tags:
        - Species
      summary: Tra cứu danh mục giống cây trồng (tìm kiếm, phân trang, lọc)
      operationId: searchSpecies
      security:
        - BearerAuth: []
      parameters:
        - name: keyword
          in: query
          description: Từ khóa tìm kiếm theo tên cây hoặc tên khoa học
          required: false
          schema:
            type: string
        - name: category
          in: query
          description: Lọc theo danh mục cây trồng (VD: Cây cảnh, Rau củ)
          required: false
          schema:
            type: string
        - name: page
          in: query
          description: Chỉ số trang (bắt đầu từ 0)
          required: false
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          description: Kích thước trang
          required: false
          schema:
            type: integer
            default: 20
        - name: sort
          in: query
          description: Sắp xếp theo cột (VD: common_name,asc)
          required: false
          schema:
            type: string
            default: common_name,asc
      responses:
        '200':
          description: Danh sách giống cây phân trang
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpeciesPageWrapper'
        '401':
          $ref: '#/components/responses/401Unauthorized'

  /species/{speciesId}:
    get:
      tags:
        - Species
      summary: Lấy chi tiết thông tin sinh học của một giống cây
      operationId: getSpeciesDetail
      security:
        - BearerAuth: []
      parameters:
        - name: speciesId
          in: path
          required: true
          description: Định danh UUID của giống cây
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Chi tiết giống cây
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpeciesDetailWrapper'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '404':
          $ref: '#/components/responses/404NotFound'

  /species/{speciesId}/favorite:
    post:
      tags:
        - Species
      summary: Đánh dấu yêu thích giống cây trồng
      operationId: addFavoriteSpecies
      security:
        - BearerAuth: []
      parameters:
        - name: speciesId
          in: path
          required: true
          description: UUID giống cây cần yêu thích
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: Đã thêm vào danh sách yêu thích
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleMessageWrapper'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '404':
          $ref: '#/components/responses/404NotFound'
        '409':
          $ref: '#/components/responses/409Conflict'
    delete:
      tags:
        - Species
      summary: Bỏ đánh dấu yêu thích giống cây
      operationId: removeFavoriteSpecies
      security:
        - BearerAuth: []
      parameters:
        - name: speciesId
          in: path
          required: true
          description: UUID giống cây cần bỏ yêu thích
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Đã bỏ khỏi danh sách yêu thích
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleMessageWrapper'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '404':
          $ref: '#/components/responses/404NotFound'

  /species/favorites:
    get:
      tags:
        - Species
      summary: Lấy danh sách giống cây yêu thích của người dùng hiện tại
      operationId: getFavoriteSpecies
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Danh sách phân trang giống cây yêu thích
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpeciesPageWrapper'
        '401':
          $ref: '#/components/responses/401Unauthorized'

  /gardens:
    get:
      tags:
        - Gardens
      summary: Lấy danh sách các khu vườn của người dùng
      operationId: getMyGardens
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Danh sách khu vườn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GardenListWrapper'
        '401':
          $ref: '#/components/responses/401Unauthorized'
    post:
      tags:
        - Gardens
      summary: Tạo khu vườn mới
      operationId: createGarden
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGardenRequest'
      responses:
        '201':
          description: Tạo khu vườn thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GardenDetailWrapper'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'

  /gardens/{gardenId}:
    get:
      tags:
        - Gardens
      summary: Chi tiết khu vườn kèm danh sách cây trồng
      operationId: getGardenDetail
      security:
        - BearerAuth: []
      parameters:
        - name: gardenId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Chi tiết khu vườn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GardenDetailWrapper'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
    put:
      tags:
        - Gardens
      summary: Cập nhật thông tin khu vườn
      operationId: updateGarden
      security:
        - BearerAuth: []
      parameters:
        - name: gardenId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGardenRequest'
      responses:
        '200':
          description: Cập nhật khu vườn thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GardenDetailWrapper'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
    delete:
      tags:
        - Gardens
      summary: Xóa khu vườn
      operationId: deleteGarden
      security:
        - BearerAuth: []
      parameters:
        - name: gardenId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Xóa khu vườn thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleMessageWrapper'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'

  /gardens/{gardenId}/plants:
    post:
      tags:
        - Plants
      summary: Thêm cây trồng mới vào khu vườn
      operationId: addPlantToGarden
      security:
        - BearerAuth: []
      parameters:
        - name: gardenId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserPlantRequest'
      responses:
        '201':
          description: Thêm cây thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPlantDetailWrapper'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'

  /plants:
    get:
      tags:
        - Plants
      summary: Danh sách tất cả cây trồng của người dùng hiện tại
      operationId: getMyPlants
      security:
        - BearerAuth: []
      parameters:
        - name: keyword
          in: query
          schema:
            type: string
        - name: gardenId
          in: query
          schema:
            type: string
            format: uuid
        - name: healthStatus
          in: query
          schema:
            type: string
            enum: [HEALTHY, NEEDS_ATTENTION, CRITICAL, UNKNOWN]
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Danh sách cây trồng phân trang
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPlantPageWrapper'
        '401':
          $ref: '#/components/responses/401Unauthorized'

  /plants/{plantId}:
    get:
      tags:
        - Plants
      summary: Lấy chi tiết một cây trồng cụ thể
      operationId: getPlantDetail
      security:
        - BearerAuth: []
      parameters:
        - name: plantId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Chi tiết cây trồng
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPlantDetailWrapper'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
    put:
      tags:
        - Plants
      summary: Cập nhật thông tin cây trồng
      operationId: updatePlant
      security:
        - BearerAuth: []
      parameters:
        - name: plantId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserPlantRequest'
      responses:
        '200':
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPlantDetailWrapper'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
    delete:
      tags:
        - Plants
      summary: Xóa một cây trồng khỏi khu vườn
      operationId: deletePlant
      security:
        - BearerAuth: []
      parameters:
        - name: plantId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Xóa cây trồng thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleMessageWrapper'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'

  /plants/{plantId}/schedules:
    get:
      tags:
        - Schedules
      summary: Danh sách lịch chăm sóc của một cây trồng
      operationId: getPlantSchedules
      security:
        - BearerAuth: []
      parameters:
        - name: plantId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING, COMPLETED, SKIPPED, PAUSED, CANCELLED]
      responses:
        '200':
          description: Danh sách lịch chăm sóc
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CareScheduleListWrapper'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'

  /plants/{plantId}/care-logs:
    get:
      tags:
        - Care Logs
      summary: Lịch sử hoạt động chăm sóc của một cây
      operationId: getPlantCareLogs
      security:
        - BearerAuth: []
      parameters:
        - name: plantId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Lịch sử chăm sóc phân trang
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CareLogPageWrapper'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'

  /plants/{plantId}/journals:
    get:
      tags:
        - Growth Journals
      summary: Danh sách nhật ký phát triển của một cây
      operationId: getPlantJournals
      security:
        - BearerAuth: []
      parameters:
        - name: plantId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Nhật ký phát triển phân trang
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrowthJournalPageWrapper'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'

  /schedules:
    post:
      tags:
        - Schedules
      summary: Tạo mới lịch chăm sóc cho cây
      operationId: createSchedule
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateScheduleRequest'
      responses:
        '201':
          description: Tạo lịch chăm sóc thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CareScheduleWrapper'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'

  /schedules/today:
    get:
      tags:
        - Schedules
      summary: Danh sách lịch chăm sóc cần thực hiện trong ngày hôm nay
      operationId: getTodaySchedules
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Danh sách lịch trong ngày
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodayScheduleListWrapper'
        '401':
          $ref: '#/components/responses/401Unauthorized'

  /schedules/{scheduleId}:
    put:
      tags:
        - Schedules
      summary: Cập nhật thông tin lịch chăm sóc
      operationId: updateSchedule
      security:
        - BearerAuth: []
      parameters:
        - name: scheduleId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateScheduleRequest'
      responses:
        '200':
          description: Cập nhật lịch thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CareScheduleWrapper'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
    delete:
      tags:
        - Schedules
      summary: Xóa lịch chăm sóc
      operationId: deleteSchedule
      security:
        - BearerAuth: []
      parameters:
        - name: scheduleId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Xóa lịch thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleMessageWrapper'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'

  /schedules/{scheduleId}/complete:
    post:
      tags:
        - Schedules
      summary: Đánh dấu đã hoàn thành một lượt chăm sóc theo lịch
      description: Ghi nhận care_log với trạng thái COMPLETED và tự động tính toán lượt chăm sóc kế tiếp.
      operationId: completeSchedule
      security:
        - BearerAuth: []
      parameters:
        - name: scheduleId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteCareRequest'
      responses:
        '201':
          description: Ghi nhận hoàn thành thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompleteScheduleResponseWrapper'
        '400':
          $ref: '#/components/responses/400BadRequest'

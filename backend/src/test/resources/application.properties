spring.application.name=plant-care-backend

# Default test profile: H2 in-memory (PostgreSQL mode)
spring.datasource.url=jdbc:h2:mem:plantcaredb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.flyway.enabled=false
spring.h2.console.enabled=false

# Test JWT secret (Base64 of a 256-bit key - strictly for testing only)
jwt.secret-base64=${JWT_SECRET_BASE64:dGVzdC1zZWNyZXQta2V5LWZvci1nb3BsYW50LWp3dC10b2tlbi1zaWduaW5nLW11c3QtYmUtMzItYnl0ZXM=}
jwt.expiration-ms=3600000

# CORS for testing
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8081,http://localhost:19006,http://localhost:3000}

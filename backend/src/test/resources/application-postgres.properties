# ── PostgreSQL Test Profile ──
# Active when SPRING_PROFILES_ACTIVE=postgres (e.g. in GitHub Actions CI with postgres service)

spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://localhost:5432/goplant_test}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:postgrespassword}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Flyway enabled for PostgreSQL to run V1 migration and test real schema
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

spring.h2.console.enabled=false

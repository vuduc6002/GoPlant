# ── Supabase PostgreSQL profile ──
# Activate: $env:SPRING_PROFILES_ACTIVE = "supabase"
# Required env vars: SUPABASE_DB_URL, SUPABASE_DB_USERNAME, SUPABASE_DB_PASSWORD
#
# SUPABASE_DB_URL example: jdbc:postgresql://<pooler-host>:5432/postgres?sslmode=require

spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USERNAME}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:0}
spring.datasource.hikari.connection-timeout=30000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${DB_SHOW_SQL:false}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ── Flyway: DISABLED by default for Supabase ──
# Supabase migrations must NEVER run automatically on simple profile activation.
# Only enabled if explicitly authorized via SUPABASE_FLYWAY_ENABLED=true.
spring.flyway.enabled=${SUPABASE_FLYWAY_ENABLED:false}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# ── Disable H2 ──
spring.h2.console.enabled=false

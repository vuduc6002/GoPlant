# Supabase PostgreSQL configuration.
# Activate with: .\mvnw.cmd spring-boot:run -Dspring-boot.run.profiles=supabase
# Or set SPRING_PROFILES_ACTIVE=supabase before running.
#
# Use the Session pooler connection details from Supabase Dashboard > Connect.
# SUPABASE_DB_URL must be a JDBC URL, e.g.:
# jdbc:postgresql://<pooler-host>:5432/postgres?sslmode=require
# With session mode the username is typically postgres.<project-ref>.
# Never commit the database password or put it in this file.

spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USERNAME}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Suitable for the small shared development database. Adjust only after measuring usage.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:0}
spring.datasource.hikari.connection-timeout=30000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${DB_SHOW_SQL:false}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Supabase connection is encrypted by sslmode=require in SUPABASE_DB_URL.

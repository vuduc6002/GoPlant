spring.application.name=plant-care-backend

# ── Default profile: H2 in-memory (for quick local dev without PostgreSQL) ──
spring.datasource.url=jdbc:h2:mem:plantcaredb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ── JPA / Hibernate ──
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ── Flyway: DISABLED on default H2 profile ──
# H2 cannot run PostgreSQL-specific SQL (GIN indexes, pgcrypto, TEXT[], etc).
# Flyway is enabled only on the 'postgres' and 'supabase' profiles.
spring.flyway.enabled=false

# ── H2 Console ──
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── Server ──
server.port=8080

# ── JWT Configuration ──
# MUST set JWT_SECRET_BASE64 env var (min 256-bit / 32-byte base64-encoded key)
jwt.secret-base64=${JWT_SECRET_BASE64:}
jwt.expiration-ms=86400000

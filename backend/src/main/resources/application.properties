spring.application.name=plant-care-backend

# ── Default profile: H2 in-memory (for quick local dev without PostgreSQL) ──
spring.datasource.url=jdbc:h2:mem:plantcaredb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ── JPA / Hibernate ──
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ── Flyway: DISABLED on default H2 profile ──
spring.flyway.enabled=false

# ── H2 Console ──
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── Server ──
server.port=8080

# ── JWT Configuration ──
# MUST set JWT_SECRET_BASE64 env var (min 256-bit / 32-byte base64-encoded key)
jwt.secret-base64=${JWT_SECRET_BASE64:}
jwt.expiration-ms=86400000

# ── CORS Configuration ──
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8081,http://localhost:19006,http://localhost:3000,http://127.0.0.1:8081,http://10.0.2.2:8081}

# ── Supabase Storage Configuration (G5.5.2b) ──
supabase.url=${SUPABASE_URL:}
supabase.storage.api-key=${SUPABASE_STORAGE_API_KEY:${SUPABASE_SERVICE_ROLE_KEY:}}
supabase.storage.api-key-type=${SUPABASE_STORAGE_API_KEY_TYPE:auto}
supabase.storage.bucket=${SUPABASE_STORAGE_BUCKET:goplant-private-media}
supabase.storage.connect-timeout-ms=${SUPABASE_STORAGE_CONNECT_TIMEOUT_MS:10000}
supabase.storage.read-timeout-ms=${SUPABASE_STORAGE_READ_TIMEOUT_MS:30000}
media.max-file-size-bytes=${MEDIA_MAX_FILE_SIZE_BYTES:5242880}
media.signed-url-ttl-seconds=${MEDIA_SIGNED_URL_TTL_SECONDS:300}
media.url-validator.allowed-schemes=${MEDIA_ALLOWED_SCHEMES:https}
media.reconciliation.fixed-delay-ms=${MEDIA_RECONCILIATION_FIXED_DELAY_MS:900000}
media.reconciliation.initial-delay-ms=${MEDIA_RECONCILIATION_INITIAL_DELAY_MS:60000}
media.reconciliation.scheduling.enabled=${MEDIA_RECONCILIATION_SCHEDULING_ENABLED:true}
media.reconciliation.batch-size=${MEDIA_RECONCILIATION_BATCH_SIZE:50}
media.reconciliation.safety-window-seconds=${MEDIA_RECONCILIATION_SAFETY_WINDOW_SECONDS:300}
media.reconciliation.lease-duration-seconds=${MEDIA_RECONCILIATION_LEASE_DURATION_SECONDS:60}
media.reconciliation.max-attempts=${MEDIA_RECONCILIATION_MAX_ATTEMPTS:5}
media.reconciliation.base-backoff-seconds=${MEDIA_RECONCILIATION_BASE_BACKOFF_SECONDS:30}

# ── Multipart Configuration ──
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ── PostgreSQL Local profile ──
# Activate: $env:SPRING_PROFILES_ACTIVE = "postgres"
# Required env vars: POSTGRES_URL, POSTGRES_USER, POSTGRES_PASSWORD

spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://localhost:5432/goplant}
spring.datasource.username=${POSTGRES_USER:goplant}
spring.datasource.password=${POSTGRES_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# ── Flyway: ENABLED for PostgreSQL environment ──
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# ── Disable H2 ──
spring.h2.console.enabled=false

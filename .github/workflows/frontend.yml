name: Frontend CI

on:
  push:
    branches: ["main", "feature/integrate-frontend-report"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Automated tests
        run: npm test

      - name: Validate Expo config
        run: npx expo config --json

      - name: Check Expo dependencies compatibility
        run: CI=1 npx expo install --check
